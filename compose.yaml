name: forgel

services:
  forgel:
    build: .
    image: forgel:local
    environment:
      FORGEL_HOME: /data
      FORGEL_REGISTRY: /app/registry/recipes.json
      FORGEL_JURISDICTIONS: /app/jurisdiction
      # The core runs QA in-process inside this container. For containerized
      # QA, run the CLI on the host or attach a sandbox runner (M1).
      FORGEL_QA_RUNTIME: local
    volumes:
      - forgel-data:/data
    command: ["demo"]

  telegram:
    build: .
    image: forgel:local
    profiles: ["telegram"]
    restart: unless-stopped
    environment:
      FORGEL_HOME: /data
      FORGEL_REGISTRY: /app/registry/recipes.json
      FORGEL_JURISDICTIONS: /app/jurisdiction
      FORGEL_QA_RUNTIME: local
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN:-}"
      TELEGRAM_ALLOWED_CHAT_IDS: "${TELEGRAM_ALLOWED_CHAT_IDS:-}"
      TELEGRAM_POLL_TIMEOUT: "${TELEGRAM_POLL_TIMEOUT:-}"
      FORGEL_MODEL_API_KEY: "${FORGEL_MODEL_API_KEY:-}"
      FORGEL_MODEL_BASE_URL: "${FORGEL_MODEL_BASE_URL:-}"
      FORGEL_MODEL_NAME: "${FORGEL_MODEL_NAME:-}"
      FORGEL_MODEL_MODE: "${FORGEL_MODEL_MODE:-auto}"
      FORGEL_GITHUB_TOKEN: "${FORGEL_GITHUB_TOKEN:-}"
      FORGEL_GITHUB_APP_ID: "${FORGEL_GITHUB_APP_ID:-}"
      FORGEL_GITHUB_INSTALLATION_ID: "${FORGEL_GITHUB_INSTALLATION_ID:-}"
      FORGEL_GITHUB_APP_PRIVATE_KEY: "${FORGEL_GITHUB_APP_PRIVATE_KEY:-}"
      FORGEL_GITHUB_APP_PRIVATE_KEY_PATH: "${FORGEL_GITHUB_APP_PRIVATE_KEY_PATH:-}"
      FORGEL_GITHUB_API_BASE: "${FORGEL_GITHUB_API_BASE:-https://api.github.com}"
    volumes:
      - forgel-data:/data
    command: ["telegram"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  forgel-data:
