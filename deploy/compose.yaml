# Production deployment of the Forgel Telegram daemon.
# Written to the remote server by `forgel deploy`; do not edit it there.
# The Compose project name comes from COMPOSE_PROJECT_NAME in .env (v1/v2).
version: "3.9"

services:
  forgel:
    image: ${FORGEL_IMAGE:?FORGEL_IMAGE is required}
    restart: unless-stopped
    command: ["telegram"]
    env_file:
      - .env
    environment:
      FORGEL_HOME: /data
      FORGEL_REGISTRY: /app/registry/recipes.json
      FORGEL_JURISDICTIONS: /app/jurisdiction
      FORGEL_QA_RUNTIME: local
      # local runs project code in this container (single-tenant). docker
      # runs it in a per-project container on a separate daemon. The host
      # Docker socket is never mounted.
      FORGEL_SANDBOX: ${FORGEL_SANDBOX:-local}
      FORGEL_SANDBOX_HOST: ${FORGEL_SANDBOX_HOST:-}
      FORGEL_SANDBOX_PROJECTS_ROOT: ${FORGEL_SANDBOX_PROJECTS_ROOT:-}
      FORGEL_SANDBOX_IMAGE: ${FORGEL_SANDBOX_IMAGE:-}
      FORGEL_SANDBOX_NETWORK: ${FORGEL_SANDBOX_NETWORK:-none}
      FORGEL_SANDBOX_CPUS: ${FORGEL_SANDBOX_CPUS:-2}
      FORGEL_SANDBOX_MEMORY: ${FORGEL_SANDBOX_MEMORY:-2g}
      FORGEL_SANDBOX_PIDS: ${FORGEL_SANDBOX_PIDS:-512}
      FORGEL_SANDBOX_IMAGES: ${FORGEL_SANDBOX_IMAGES:-}
      FORGEL_SANDBOX_REQUIRE_DIGEST: ${FORGEL_SANDBOX_REQUIRE_DIGEST:-0}
    volumes:
      - forgel-data:/data
      - ./secrets:/run/secrets:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Per-project sandbox. Opt in with COMPOSE_PROFILES=sandbox in .env.deploy.
  # A containerized dockerd needs mount and network administration, hence the
  # privilege. Treat the host as trusted single-tenant, or point
  # FORGEL_SANDBOX_HOST at a remote Docker host for stronger isolation.
  sandbox:
    image: docker:27-dind
    profiles: ["sandbox"]
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: ""
    command: ["dockerd", "--host=tcp://0.0.0.0:2375"]
    volumes:
      - forgel-data:/sandbox-data

volumes:
  forgel-data:
