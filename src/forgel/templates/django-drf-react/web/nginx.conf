# Serve the built SPA and proxy /healthz to the api service.
#
# The browser only talks to its own origin, so the API needs neither a
# published port nor CORS headers. The upstream is resolved per request through
# the Docker DNS (127.0.0.11), so nginx starts even while api is still booting.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
