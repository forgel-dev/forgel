# environment.yaml — how Forgel builds and tests itself.
#
# This is the contract Forgel reads when it adopts its own repository. `build`
# is relative to this file; commands run at the repository root. Tests import
# the package from `src`, and the suite creates git repositories, so the image
# carries git.
#
# `e2e` is the program gate. The first command is the offline self-hosting
# smoke: adopt a local fixture, plan a milestone, run one task through the
# coding agent, QA and review, and stop at the approval gate. The second is
# the cross-repository engine + Forgel Code gate. `mounts` exposes the client
# repository to it as FORGEL_REPO_CODE (the real sibling path locally, /code
# in the sandbox). Neither command touches the network, Docker or cloud
# resources.
build: environment
mounts: [code]
test: ["python3 -m unittest discover -s tests"]
e2e:
  - "env FORGEL_MODEL_MODE=script PYTHONPATH=src python tests/e2e/run_self_hosting_e2e.py"
  - "env FORGEL_MODEL_MODE=script PYTHONPATH=src python tests/e2e/run_client_e2e.py"
env:
  PYTHONPATH: src
