[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "forgel"
version = "0.1.0"
description = "Open-source autonomous software studio"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Forgel contributors" }]
keywords = ["agents", "software-factory", "orchestration", "qa", "self-hosted"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
  "mypy>=1.11",
  "coverage>=7.6",
]

[project.scripts]
forgel = "forgel.cli:main"

[project.urls]
Homepage = "https://forgel.io"
Repository = "https://github.com/forgel-dev/forgel"
Issues = "https://github.com/forgel-dev/forgel/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/forgel"]

[tool.hatch.build.targets.sdist]
include = [
  "src/forgel",
  "tests",
  "registry",
  "README.md",
  "PLAN.md",
  "CONTRIBUTING.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true

[tool.coverage.run]
source = ["forgel"]
omit = ["*/templates/*"]
